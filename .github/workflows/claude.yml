# The Claude agent. Mention @claude in a new issue, an issue or PR comment, or a
# PR review, and Claude reviews or develops on a branch and opens a pull request.
#
# Installed from yilmaz-games/claude-agent. Change the template there and run
# install.sh again rather than editing this copy.
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      # Scrub Anthropic, cloud and GitHub secrets from the commands Claude runs
      # (npm scripts, builds), since those run third-party code.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        continue-on-error: true
        run: |
          if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then npm install -g bun && bun install --frozen-lockfile
          elif [ -f yarn.lock ]; then npx --yes yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{description}}"
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(bun:*),Bash(bunx:*),Bash(node:*),Bash(tsc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git branch:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*),WebFetch,WebSearch,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash(git push:*),Bash(gh pr merge:*),Bash(gh api:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gh workflow:*),Bash(npm publish:*),Bash(npm run deploy:*),Bash(pnpm deploy:*),Bash(pnpm run deploy:*),Bash(yarn deploy:*),Bash(bun run deploy:*),Bash(wrangler:*),Bash(npx wrangler deploy:*),Bash(npx wrangler versions deploy:*),Bash(npx wrangler secret:*),Bash(vercel:*),Bash(npx vercel:*)"
            --append-system-prompt "You are the GitHub agent for this repository. The owner started you with an @claude mention on an issue or pull request, often from a phone. Follow the repository CLAUDE.md, with these rules on top. 1) Work only on the branch the action gives you. Never push to or merge into the default branch and never deploy: merging the pull request is the owner's decision, and it is what deploys. 2) After changing code, run the checks the repository defines (typecheck, lint, test, build; see CLAUDE.md and the package.json scripts), fix the failures you caused, and report what you ran and the results. 3) When you change code for an issue, open the pull request yourself with gh pr create against the default branch. Link the issue (Closes #N) and describe what changed, how you checked it, and what the owner should check before merging. Put the pull request link in your comment. 4) When asked to review, review the diff for bugs, security problems and behaviour changes, and do not push changes unless asked. 5) If the request is unclear or risky (data loss, secrets, production settings, billing), stop and ask in your comment instead of guessing. 6) Keep comments short: lead with the result."
